<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="shapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="innerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.9" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="8" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="innerGlow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Background rounded square -->
    <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" />

    <!-- Outer hexagonal ring representing process/simulation -->
    <polygon points="256,80 404,166 404,338 256,424 108,338 108,166" fill="none" stroke="url(#shapeGrad)"
        stroke-width="6" opacity="0.3" />

    <!-- Stylized "A" shape - the Arken mark -->
    <g filter="url(#glow)">
        <!-- Main A shape -->
        <path d="M256 120 L160 380 L192 380 L216 310 L296 310 L320 380 L352 380 Z" fill="url(#shapeGrad)" />
        <!-- Crossbar of A -->
        <rect x="210" y="270" width="92" height="6" rx="3" fill="url(#bgGrad)" opacity="0.8" />
    </g>

    <!-- Neural network / AI nodes around the A -->
    <g filter="url(#innerGlow)" opacity="0.85">
        <!-- Top node -->
        <circle cx="256" cy="100" r="8" fill="#06b6d4" />
        <!-- Left nodes -->
        <circle cx="140" cy="200" r="6" fill="#3b82f6" />
        <circle cx="128" cy="310" r="6" fill="#8b5cf6" />
        <!-- Right nodes -->
        <circle cx="372" cy="200" r="6" fill="#3b82f6" />
        <circle cx="384" cy="310" r="6" fill="#8b5cf6" />

        <!-- Connecting lines (neural paths) -->
        <line x1="256" y1="100" x2="140" y2="200" stroke="#06b6d4" stroke-width="1.5" opacity="0.5" />
        <line x1="256" y1="100" x2="372" y2="200" stroke="#06b6d4" stroke-width="1.5" opacity="0.5" />
        <line x1="140" y1="200" x2="128" y2="310" stroke="#3b82f6" stroke-width="1.5" opacity="0.4" />
        <line x1="372" y1="200" x2="384" y2="310" stroke="#3b82f6" stroke-width="1.5" opacity="0.4" />
        <line x1="140" y1="200" x2="372" y2="200" stroke="#3b82f6" stroke-width="1" opacity="0.25" />
        <line x1="128" y1="310" x2="384" y2="310" stroke="#8b5cf6" stroke-width="1" opacity="0.25" />
    </g>

    <!-- Small process flow dots (representing simulation/flowsheet) -->
    <g opacity="0.6">
        <circle cx="256" cy="400" r="4" fill="#06b6d4">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
        </circle>
        <circle cx="232" cy="408" r="3" fill="#3b82f6">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.3s" repeatCount="indefinite" />
        </circle>
        <circle cx="280" cy="408" r="3" fill="#8b5cf6">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.6s" repeatCount="indefinite" />
        </circle>
    </g>
</svg>